# Builds the serve-only image on GitHub and pushes it to GitHub Container Registry (ghcr.io).
# (Azure ACR Tasks aren't available on this subscription, so the image is built here instead.)
name: docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/trakheesi-api:latest
            ghcr.io/${{ github.repository_owner }}/trakheesi-api:${{ github.sha }}
