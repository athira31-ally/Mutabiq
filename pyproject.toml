[project]
name = "trakheesi-compliance-detector"
version = "2026.1.0"
description = "UAE real-estate listing compliance pipeline: Trakheesi permits, watermark detection, duplicate photos."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
